<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рестораны — Столик</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar navbar-expand-sm bg-white">
  <div class="container">
    <a class="navbar-brand" href="index.html">Столик</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button>
    <nav class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Рестораны</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">Бронирования</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Кабинет</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Войти</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="container py-4">
<h1 class="h3 mb-4">Поиск ресторанов</h1>
<div class="row g-4">
  <aside class="col-lg-3">
    <form id="filters" class="card card-body">
      <div class="mb-3"><label for="q" class="form-label">Название</label>
        <input type="search" id="q" name="q" class="form-control"></div>
      <div class="mb-3"><label for="cuisine" class="form-label">Кухня</label>
        <select id="cuisine" name="cuisine" class="form-select"><option value="">Любая</option>
          <option value="italian">Итальянская</option><option value="japanese">Японская</option>
          <option value="georgian">Грузинская</option><option value="french">Французская</option></select></div>
      <div class="mb-3"><label for="district" class="form-label">Расположение</label>
        <select id="district" name="district" class="form-select"><option value="">Любое</option>
          <option value="center">Центр</option><option value="north">Север</option><option value="south">Юг</option></select></div>
      <div class="mb-3"><label for="price" class="form-label">Цена (до)</label>
        <select id="price" name="price" class="form-select"><option value="">Любая</option>
          <option value="1">₽</option><option value="2">₽₽</option><option value="3">₽₽₽</option></select></div>
      <button type="reset" class="btn btn-outline-secondary">Сбросить</button>
    </form>
  </aside>
  <section class="col-lg-9">
    <p id="state" class="text-muted" role="status">Загрузка…</p>
    <div id="results" class="row g-4"></div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/restaurants.js"></script>
</body>
</html>
