<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ресторан — Столик</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar navbar-expand-sm bg-white">
  <div class="container">
    <a class="navbar-brand" href="index.html">Столик</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button>
    <nav class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Рестораны</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">Бронирования</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Кабинет</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Войти</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="container py-4">
<p id="state" class="text-muted" role="status">Загрузка…</p>
<div id="content" hidden>
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
      <h1 class="h3 mb-1" id="rName"></h1>
      <p class="text-muted mb-0" id="rMeta"></p>
    </div>
    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#bookingModal">Забронировать</button>
  </div>
  <div class="row g-3 mb-4" id="rPhotos"></div>
  <section class="mb-4">
    <h2 class="h5">О ресторане</h2>
    <p class="mb-0" id="rAbout"></p>
  </section>
  <section class="mb-4">
    <h2 class="h5">Меню</h2>
    <ul class="list-group" id="rMenu"></ul>
  </section>
  <section>
    <h2 class="h5">Отзывы</h2>
    <div id="rReviews"></div>
  </section>
</div>

<div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingTitle" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="bookingForm">
      <div class="modal-header">
        <h2 class="modal-title h5" id="bookingTitle">Бронирование</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <div id="bookingAlert" class="alert alert-warning" role="alert" hidden></div>
        <div class="mb-3"><label for="date" class="form-label">Дата</label>
          <input type="date" id="date" class="form-control" required></div>
        <div class="row g-3">
          <div class="col-6"><label for="time" class="form-label">Время</label>
            <input type="time" id="time" class="form-control" required></div>
          <div class="col-6"><label for="guests" class="form-label">Гостей</label>
            <input type="number" id="guests" class="form-control" min="1" max="12" value="2" required></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-accent">Забронировать</button></div>
    </form>
  </div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/restaurant.js"></script>
</body>
</html>
