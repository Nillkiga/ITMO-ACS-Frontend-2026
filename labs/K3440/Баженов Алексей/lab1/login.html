<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Столик</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar navbar-expand-sm bg-white">
  <div class="container">
    <a class="navbar-brand" href="index.html">Столик</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button>
    <nav class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Рестораны</a></li>
        <li class="nav-item"><a class="nav-link" href="bookings.html">Бронирования</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Кабинет</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Войти</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="container py-4">
<div class="auth mx-auto card card-body mt-4">
  <h1 class="h3 mb-4">Вход</h1>
  <form action="profile.html">
    <div class="mb-3"><label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control" required></div>
    <div class="mb-3"><label for="password" class="form-label">Пароль</label>
      <div class="input-group">
        <input type="password" id="password" class="form-control" required minlength="6">
        <button type="button" id="togglePassword" class="btn btn-outline-secondary">Показать</button>
      </div></div>
    <button class="btn btn-accent w-100">Войти</button>
  </form>
  <p class="text-center mt-3 mb-0">Нет аккаунта? <a href="register.html" class="text-decoration-underline">Регистрация</a></p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
